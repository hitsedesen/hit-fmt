branch_protection:
  policies:
    - target: default_branch
      message: "Changes to the default branch must be made through a pull request"
      rules:
        - prevent_force_push
        - prevent_non_pr_changes
        - prevent_deletion
    - target: tag
      matches: "v*"
      message: "Release tags cannot be changed or deleted"
      rules:
        - prevent_update
