name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: hit-fmt
    timeout-minutes: 30
    container:
      image: git.hitsedesen.me/hitsedesen/hit-fmt-ci:ubuntu24-v1
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    steps:
      # Requires a Gitea Runner with built-in checkout support.
      - uses: builtin:checkout
      - name: Build, test, and check formatting
        run: |
          set -eu
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHIT_FMT_TEST=ON
          cmake --build build --parallel 2
          build/tests/tests
          build/tests/allocation_tests
          echo 'All tests passed'
          build/cli/hit-fmt --check .
          echo 'No formatting issues found'
